[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-guardian"
version = "0.1.0"
description = "Governance sidecar for AI agents: policy enforcement, budgets, tamper-evident audit logs, and safety evals"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ramkumar Bharathan" }]
keywords = ["ai", "agents", "governance", "safety", "audit", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.scripts]
agent-guardian = "agent_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
